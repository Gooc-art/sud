name: max-bot

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: self-hosted
    steps:
      - name: Update app
        run: |
          git -C "$HOME/sud-app" fetch origin main
          git -C "$HOME/sud-app" reset --hard origin/main
      - name: Configure env
        run: |
          mkdir -p "$HOME/.config/sud"
          printf 'MAX_TOKEN=%s\nMAX_API_BASE=https://platform-api2.max.ru\nSUD_MAX_DAYS=45\nSUD_EXPORT_TIMEOUT_SECONDS=14400\nSUD_HTTP_TIMEOUT_SECONDS=20\nSUD_ADMIN_USER_IDS=6393482\nSUD_ADMIN_PHONES=79320588150\nSUD_COMMERCE_PASSWORD=%s\n' '${{ secrets.MAX_TOKEN }}' '${{ secrets.SUD_COMMERCE_PASSWORD }}' > "$HOME/.config/sud/max-bot.env"
          chmod 600 "$HOME/.config/sud/max-bot.env"
      - name: Install and restart bot
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          "$HOME/sud-app/scripts/install_max_bot_service.sh"
          systemctl --user restart sud-max-bot.service
          systemctl --user status sud-max-bot.service --no-pager
