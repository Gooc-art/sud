name: max-bot

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: self-hosted
    steps:
      - name: Update app
        run: |
          git -C "$HOME/sud-app" fetch origin main
          git -C "$HOME/sud-app" reset --hard origin/main
      - name: Configure env
        run: |
          mkdir -p "$HOME/.config/sud"
          printf 'MAX_TOKEN=%s\nMAX_API_BASE=https://platform-api2.max.ru\nSUD_MAX_DAYS=45\nSUD_EXPORT_TIMEOUT_SECONDS=14400\nSUD_HTTP_TIMEOUT_SECONDS=20\nSUD_ADMIN_USER_IDS=6393482\nSUD_ADMIN_PHONES=79320588150\nSUD_COMMERCE_PASSWORD=%s\n' '${{ secrets.MAX_TOKEN }}' '${{ secrets.SUD_COMMERCE_PASSWORD }}' > "$HOME/.config/sud/max-bot.env"
          chmod 600 "$HOME/.config/sud/max-bot.env"
      - name: Install and restart bot
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          "$HOME/sud-app/scripts/install_max_bot_service.sh"
          echo "== max bot processes before restart =="
          ps -efww | grep '[m]ax_bot.py --poll' || true
          echo "== max bot env =="
          grep -E '^(SUD_ADMIN_USER_IDS|SUD_ADMIN_PHONES|SUD_COMMERCE_PASSWORD)=' "$HOME/.config/sud/max-bot.env" | sed -E 's/(SUD_COMMERCE_PASSWORD=).+/\1SET/'
          echo "== max bot state =="
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path.home() / ".config/sud/max-bot-state.json"
          print("exists", path.exists())
          if path.exists():
              data = json.loads(path.read_text())
              print(json.dumps(data, ensure_ascii=False, sort_keys=True))
          PY
          systemctl --user stop sud-max-bot.service || true
          pkill -9 -f '[m]ax_bot.py --poll' || true
          systemctl --user start sud-max-bot.service
          systemctl --user status sud-max-bot.service --no-pager
          echo "== max bot processes after restart =="
          ps -efww | grep '[m]ax_bot.py --poll' || true
